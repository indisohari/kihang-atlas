name: Atlas source and browser verification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out public repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Run source and synchronization mock checks
        run: node tests/atlas_release.test.cjs

      - name: Install pinned browser test driver (no project dependencies)
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.1

      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium

      - name: Run source-backed responsive, map, filter and modal checks
        run: node tests/atlas_browser_smoke.cjs
